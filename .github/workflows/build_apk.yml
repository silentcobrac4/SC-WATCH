name: Build SC watch from ZIP (Robust)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Prepare and Unzip Archive
      run: |
        mkdir -p extracted_project
        unzip -q SC-WATCH-1.zip -d extracted_project
        # فحص وتصحيح المسار تلقائياً في حال كانت الملفات داخل مجلد فرعي داخل الـ ZIP
        if [ -d "extracted_project/sc_watch_project" ]; then
          echo "PROJECT_DIR=extracted_project/sc_watch_project" >> $GITHUB_ENV
        elif [ -d "extracted_project/SC_Watch_Project" ]; then
          echo "PROJECT_DIR=extracted_project/SC_Watch_Project"
        else
          # البحث التلقائي عن المجلد الذي يحتوي على ملف gradlew
          FOUND_DIR=$(find extracted_project -name "gradlew" -maxdepth 3 | xargs dirname | head -n 1)
          if [ -n "$FOUND_DIR" ]; then
            echo "PROJECT_DIR=$FOUND_DIR" >> $GITHUB_ENV
          else
            echo "PROJECT_DIR=extracted_project" >> $GITHUB_ENV
          fi
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make Gradle Wrapper Executable and Build
      run: |
        # طباعة المسار للتأكد منه في السجلات
        echo "Using project directory: ${{ env.PROJECT_DIR }}"
        cd ${{ env.PROJECT_DIR }}
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SC-Watch-Debug-APK
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
        
