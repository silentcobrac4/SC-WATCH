name: Build SC watch from ZIP

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip Project Archive
      run: |
        mkdir -p extracted_project
        unzip SC-WATCH-1.zip -d extracted_project

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make Gradle Wrapper Executable
      run: chmod +x extracted_project/gradlew || true

    - name: Build Debug APK
      working-directory: extracted_project
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SC-Watch-Debug-APK
        path: extracted_project/app/build/outputs/apk/debug/app-debug.apk
        
