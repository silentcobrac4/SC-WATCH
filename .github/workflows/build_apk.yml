name: Build SC watch from ZIP (Final Fix)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Prepare and Unzip Archive
      run: |
        mkdir -p extracted_project
        unzip -q SC-WATCH-1.zip -d extracted_project
        echo "=== الملفات والمجلدات المفكوكة ==="
        ls -la extracted_project
        ls -la extracted_project/* || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Find Project and Build APK
      run: |
        # العثور على المجلد الذي يحتوي على gradlew بشكل تلقائي تام
        GRADLEW_PATH=$(find extracted_project -name "gradlew" -type f | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew not found!"
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "Found project directory at: $PROJECT_DIR"
        
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SC-Watch-Debug-APK
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
        
